name: System renderer integration

on:
  pull_request:
    paths:
      - ".github/workflows/system-renderers.yml"
      - "pyproject.toml"
      - "src/shared/**"
      - "src/capabilities/core/qwen_mm_plugins_core/renderers/**"
      - "tests/test_isolated_worker.py"
      - "tests/test_renderers.py"
      - "tests/assets/**"
  push:
    branches: [main, codex/issue-31-windows-ci]
    paths:
      - ".github/workflows/system-renderers.yml"
      - "pyproject.toml"
      - "src/shared/**"
      - "src/capabilities/core/qwen_mm_plugins_core/renderers/**"
      - "tests/test_isolated_worker.py"
      - "tests/test_renderers.py"
      - "tests/assets/**"
  workflow_dispatch:
    inputs:
      suite:
        description: Renderer suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - office
          - latex
          - web
          - 3d
  schedule:
    - cron: "23 19 * * 1"

permissions:
  contents: read

concurrency:
  group: system-renderers-${{ github.ref }}-${{ inputs.suite || 'auto' }}
  cancel-in-progress: true

jobs:
  office:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'office'
    name: Office (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.9"
          python-version: "3.12"
          enable-cache: true

      - name: Install LibreOffice (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-writer libreoffice-impress

      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install libreoffice-fresh --yes --no-progress

      - name: Run Office regressions (Ubuntu)
        if: runner.os == 'Linux'
        run: >-
          uv run --no-project --python 3.12 --with pytest --with ".[core]"
          python -m pytest -q tests/test_renderers.py
          -k "office or docx or pptx"

      - name: Run Office regressions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lo = Get-Item "C:\Program Files\LibreOffice\program\soffice.exe"
          $env:PATH = "$env:PATH;$($lo.Directory.FullName)"
          uv run --no-project --python 3.12 --with pytest --with ".[core]" `
            python -m pytest -q tests/test_renderers.py `
            -k "office or docx or pptx"

  latex:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'latex'
    name: LaTeX (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.9"
          python-version: "3.12"
          enable-cache: true

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends texlive-latex-base texlive-latex-extra

      - name: Run LaTeX regressions
        run: >-
          uv run --no-project --python 3.12 --with pytest --with ".[core]"
          python -m pytest -q tests/test_renderers.py -k "latex"

  web:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'web'
    name: Playwright (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.9"
          python-version: "3.12"
          enable-cache: true

      - name: Install Chromium (Ubuntu)
        if: runner.os == 'Linux'
        run: >-
          uv run --no-project --python 3.12 --with ".[core]"
          playwright install --with-deps chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: >-
          uv run --no-project --python 3.12 --with ".[core]"
          playwright install chromium

      - name: Run Playwright regressions
        run: |
          uv run --no-project --python 3.12 --with pytest --with ".[core]" python -m pytest -q `
            tests/test_renderers.py -k "web or html"
          uv run --no-project --python 3.12 --with pytest --with ".[core]" python -m pytest -q `
            tests/test_isolated_worker.py
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Run Playwright regressions
        run: |
          uv run --no-project --python 3.12 --with pytest --with ".[core]" python -m pytest -q \
            tests/test_renderers.py -k "web or html"
          uv run --no-project --python 3.12 --with pytest --with ".[core]" python -m pytest -q \
            tests/test_isolated_worker.py
        if: runner.os == 'Linux'

  native-3d:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == '3d'
    name: Native 3D (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.9"
          python-version: "3.12"
          enable-cache: true

      - name: Run isolated 3D regressions
        shell: pwsh
        run: |
          uv run --no-project --python 3.12 --with pytest --with ".[core]" python -m pytest -q `
            tests/test_isolated_worker.py
          uv run --no-project --python 3.12 --with pytest --with ".[core]" python -m pytest -q `
            tests/test_renderers.py -k "3d"
