name: Isolated worker validation

on:
  push:
    branches: [codex/issue-31-windows-ci]

permissions:
  contents: read

jobs:
  isolated-worker:
    name: ${{ matrix.os }} stdio 3D
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.9"
          python-version: "3.12"
          enable-cache: true

      - name: Run isolation and stdio regressions
        run: >-
          uv run --no-project
          --python 3.12
          --with pytest
          --with pytest-timeout
          --with "mcp>=1,<2"
          python -m pytest -q
          --timeout=240
          tests/test_isolated_worker.py
          tests/test_isolated_stdio_3d.py
