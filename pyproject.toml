[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-mm-plugins"
dynamic = ["version"]
description = "Qwen-MM-Plugins: an Agent Skills + MCP tools platform for vision-language models — read/visualize any file + vision-language APIs, hierarchical graph memory for long-video QA, media generation/video-edit, and Blender/FreeCAD 3D-CAD capabilities."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Ship this project's LICENSE plus third-party attribution + vendored MIT license texts
# (Blender/FreeCAD addons) into the wheel's .dist-info/licenses/.
license-files = [
    "LICENSE",
    "src/capabilities/blender/NOTICE.md",
    "src/capabilities/freecad/NOTICE.md",
    "src/capabilities/blender/qwen_mm_plugins_blender/vendor/LICENSE",
    "src/capabilities/freecad/qwen_mm_plugins_freecad/vendor/FreeCADMCP/LICENSE",
]
authors = [{ name = "Qwen Team" }]
keywords = ["mcp", "vision-language", "qwen", "video", "agent-skills"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Base runtime — enough to run a server + read_image; everything else is an extra below.
dependencies = [
    "mcp>=1.0.0,<2",
    "anyio>=4.0,<5",
    "pillow<12",
]

[project.urls]
Homepage = "https://github.com/QwenLM/Qwen-MM-Plugins"
Repository = "https://github.com/QwenLM/Qwen-MM-Plugins"
Issues = "https://github.com/QwenLM/Qwen-MM-Plugins/issues"

[project.optional-dependencies]
# capability extras — compose via the profiles below
api = ["openai", "dashscope", "httpx[socks]", "requests[socks]"]  # cloud media APIs + HTTP/SOCKS
search = ["requests[socks]"]                    # Serper / Exa / Tavily + optional SOCKS proxy transport
# viz = the full visualize stack — a `core` install then renders every format out of the box.
viz = [
    "pypdfium2", "resvg-py", "lxml",          # PDF raster+text (pypdfium2) / SVG (resvg) / DrawIO / LaTeX
    "pandas", "matplotlib", "openpyxl", "tabulate",  # CSV / XLSX
    "numpy<3",                                # 3D render math (renderers/model3d) — also pulled in by the libs above
    "nbformat",                               # Jupyter notebooks
    "geopandas",                              # GIS (.geojson/.kml/.shp)
    "nibabel>=5,<6",                          # NIfTI medical volumes (.nii/.nii.gz)
    "trimesh", "pyrender", "cascadio",        # 3D (.obj/.stl/.glb)
    "playwright",                             # HTML screenshot
]
video-memory = ["numpy<3", "requests"]        # long-video graph-memory server
video-edit = ["dashscope>=1.25.16", "requests"]  # image/video/audio generation server
example = ["openai"]                           # template capability — base deps + openai (for the `describe` API demo)
oss = ["oss2"]                                 # optional: upload large media to OSS for a signed URL (memory-build clip upload, api oversized-video upload)
blender = []                                   # Blender live-session MCP client (stdlib socket; needs a running Blender + addon)
freecad = []                                   # FreeCAD live-session MCP client (stdlib xml-rpc; needs a running FreeCAD + addon)
# profiles — install ONE. `core` is now local-only (no API key); cloud tools are the api/search
# capabilities. `all` layers every server on top.
core = ["qwen-mm-plugins[viz]"]
memory = ["qwen-mm-plugins[core,video-memory]"]
all = ["qwen-mm-plugins[core,api,search,video-memory,video-edit,blender,freecad]"]

[project.scripts]
qwen-mm-plugins-core = "qwen_mm_plugins_core.__main__:main"
qwen-mm-plugins-api = "qwen_mm_plugins_api.__main__:main"
qwen-mm-plugins-search = "qwen_mm_plugins_search.__main__:main"
qwen-mm-plugins-video-memory = "qwen_mm_plugins_video_memory.__main__:main"
qwen-mm-plugins-video-edit = "qwen_mm_plugins_video_edit.__main__:main"
qwen-mm-plugins-example = "qwen_mm_plugins_example.__main__:main"
qwen-mm-plugins-blender = "qwen_mm_plugins_blender.__main__:main"
qwen-mm-plugins-freecad = "qwen_mm_plugins_freecad.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skip hydra-core's pytest plugin if it's in the ambient env (it can fail to import on an antlr4
# mismatch); harmless no-op otherwise.
addopts = "-p no:hydra_pytest"
markers = [
    # Live API round-trips (test_api_reachability.py). Skipped automatically when the relevant
    # credential is absent; select with `-m reachability`, exclude with `-m "not reachability"`.
    "reachability: hits real DashScope/Serper endpoints; requires credentials",
]

# Packages live at src/capabilities/<cap>/<import_name>/ and src/{shared,mcp_framework}: map each
# import name to its dir, then find them + subpackages under `where` (include=… drops the skill/ dirs).
[tool.setuptools]
py-modules = ["mcp_framework"]

[tool.setuptools.package-dir]
"" = "src"
qwen_mm_plugins_core = "src/capabilities/core/qwen_mm_plugins_core"
qwen_mm_plugins_api = "src/capabilities/api/qwen_mm_plugins_api"
qwen_mm_plugins_search = "src/capabilities/search/qwen_mm_plugins_search"
qwen_mm_plugins_video_memory = "src/capabilities/video-memory/qwen_mm_plugins_video_memory"
qwen_mm_plugins_video_edit = "src/capabilities/video-edit/qwen_mm_plugins_video_edit"
qwen_mm_plugins_example = "src/capabilities/example/qwen_mm_plugins_example"
qwen_mm_plugins_blender = "src/capabilities/blender/qwen_mm_plugins_blender"
qwen_mm_plugins_freecad = "src/capabilities/freecad/qwen_mm_plugins_freecad"
shared = "src/shared"

[tool.setuptools.packages.find]
where = ["src/capabilities/core", "src/capabilities/api", "src/capabilities/search", "src/capabilities/video-memory", "src/capabilities/video-edit", "src/capabilities/example", "src/capabilities/blender", "src/capabilities/freecad", "src"]
include = ["qwen_mm_plugins*", "shared*"]

# The vendored live-session addons ship as package DATA (not importable subpackages — no __init__ on
# vendor/): --launch-app resolves them on disk and hands them to Blender/FreeCAD, which load them.
[tool.setuptools.package-data]
qwen_mm_plugins_blender = ["vendor/*.py", "vendor/**/*.py", "vendor/LICENSE"]
qwen_mm_plugins_freecad = ["vendor/**/*.py", "vendor/FreeCADMCP/*.py", "vendor/FreeCADMCP/rpc_server/*.py", "vendor/FreeCADMCP/LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "mcp_framework.__version__" }
